{{- if not .Values.auth.existingSecret -}}
{{- if and (not .Values.auth.password) (not .Values.auth.jolokiaPassword) -}}
{{- fail "auth: either set auth.existingSecret to reference a pre-created Secret, or set auth.password and auth.jolokiaPassword inline" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neo4j-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neo4j-exporter.labels" . | nindent 4 }}
  {{- with (include "neo4j-exporter.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.auth.passwordKey | quote }}: {{ required "auth.password is required when auth.existingSecret is empty" .Values.auth.password | quote }}
  {{ .Values.auth.jolokiaPasswordKey | quote }}: {{ required "auth.jolokiaPassword is required when auth.existingSecret is empty" .Values.auth.jolokiaPassword | quote }}
{{- end }}
