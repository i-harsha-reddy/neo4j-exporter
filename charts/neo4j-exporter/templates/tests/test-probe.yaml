apiVersion: v1
kind: Pod
metadata:
  name: {{ include "neo4j-exporter.fullname" . }}-test-probe
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neo4j-exporter.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: probe
      image: curlimages/curl:8.10.1
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          host="{{ include "neo4j-exporter.fullname" . }}.{{ .Release.Namespace }}.svc"
          port="{{ .Values.service.port }}"
          echo "Checking /ready on ${host}:${port}"
          out="$(curl -sS -o /dev/null -w '%{http_code}' "http://${host}:${port}/ready")"
          if [ "$out" != "200" ]; then echo "FAIL: /ready returned $out"; exit 1; fi
          echo "OK: /ready -> 200"
          echo "Checking /metrics for neo4j_exporter_build_info"
          curl -sS "http://${host}:${port}/metrics" | grep -q '^neo4j_exporter_build_info' || {
            echo "FAIL: neo4j_exporter_build_info not exposed"; exit 1; }
          echo "OK: build_info present"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        capabilities: { drop: [ALL] }
