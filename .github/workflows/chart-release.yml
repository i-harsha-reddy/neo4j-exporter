name: chart-release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'chart-[0-9]+.[0-9]+.[0-9]+'
      - 'chart-[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write   # required to attach the chart .tgz as a Release asset
  packages: write
  id-token: write

# Force all JS actions to run on Node.js 24 (interim until each action upstream
# bumps its action.yml runs.using). See:
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.3

      - name: Login to GHCR (helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Login to GHCR (docker, for cosign keychain)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve chart version
        id: ver
        run: |
          ver="$(helm show chart charts/neo4j-exporter | awk '/^version:/ {print $2}')"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Chart.yaml version: ${ver}"

      - name: Lint
        run: helm lint charts/neo4j-exporter

      - name: Package
        run: |
          mkdir -p dist
          helm package charts/neo4j-exporter --destination dist

      - name: Push to OCI registry
        id: push
        run: |
          out="$(helm push dist/neo4j-exporter-${{ steps.ver.outputs.version }}.tgz oci://ghcr.io/i-harsha-reddy/charts 2>&1)"
          echo "$out"
          digest="$(echo "$out" | awk '/^Digest:/ {print $2}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: cosign sign (keyless via OIDC)
        if: steps.push.outputs.digest != ''
        run: |
          cosign sign --yes "ghcr.io/i-harsha-reddy/charts/neo4j-exporter@${{ steps.push.outputs.digest }}"

      - name: Upload packaged chart as a release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/neo4j-exporter-${{ steps.ver.outputs.version }}.tgz
