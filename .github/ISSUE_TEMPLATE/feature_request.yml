name: Feature request
description: Suggest a new collector, metric, dashboard panel, or chart capability
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check `docs/COMPATIBILITY.md` — some Neo4j-CE-vs-EE gaps are intentional
        and cannot be filled by this exporter (page cache hit rate, query runtime breakdown,
        checkpoints, cluster, per-database CPU).

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the operator-facing problem, not the implementation. "I can't tell when X is happening" beats "add metric Y".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: What metric / panel / config would solve it? If it's a metric, include name (per `neo4j_<subsystem>_<metric>_<unit>` convention), labels, and source (Cypher / APOC / Jolokia).
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Where does the data come from?
      options:
        - Cypher SHOW command (always available on CE)
        - APOC Core procedure
        - APOC Extended procedure (auto-detected)
        - Jolokia / JMX
        - Other / not sure
        - Doesn't exist in CE (please confirm)
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds exist today? Why aren't they enough?

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I confirmed this isn't Enterprise-only (see `docs/COMPATIBILITY.md`).
        - label: I searched existing issues / discussions for duplicates.
