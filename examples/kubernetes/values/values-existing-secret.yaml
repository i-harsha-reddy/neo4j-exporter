# values-existing-secret.yaml — production-friendly: chart never holds plaintext.
#
# Pre-create the Secret out-of-band (via your secrets pipeline — Vault, sealed-secrets,
# external-secrets, etc.). Example with kubectl:
#
#   kubectl -n monitoring create secret generic neo4j-creds \
#     --from-literal=password='YOUR_BOLT_PASSWORD' \
#     --from-literal=jolokia-password='YOUR_JOLOKIA_PASSWORD'
#
# Then:
#   helm install neo4j-exporter oci://ghcr.io/i-harsha-reddy/charts/neo4j-exporter \
#     --version 0.1.0 -n monitoring \
#     -f examples/kubernetes/values/values-existing-secret.yaml

auth:
  existingSecret: neo4j-creds
  passwordKey: password               # default; change if your Secret uses a different key
  jolokiaPasswordKey: jolokia-password # default
  username: monitor
