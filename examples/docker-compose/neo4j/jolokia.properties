# Jolokia agent configuration — DEMO ONLY.
#
# Production deployments must:
#   1. Use HTTPS (protocol=https) and pin certificates.
#   2. Set authMode=basic with strong credentials.
#   3. Restrict via policy.xml (read+list only on java.lang:*).
#   4. Bind to a private network — NEVER expose 8778 publicly.
#
# This demo binds 0.0.0.0:8778 with no auth so the exporter container
# can reach it. The compose file does NOT publish 8778 to the host.

host=0.0.0.0
port=8778
discoveryEnabled=false
includeStackTrace=false
agentDescription=neo4j-demo
